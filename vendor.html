<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | Vendor Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-dark-panel { background-color: #0A0A0A; }
        .text-gold { color: #D4AF37; }
    </style>
</head>
<body class="bg-black text-white p-6 md:p-10 italic">
    <div class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center bg-dark-panel p-8 rounded-3xl border border-gold/10 gap-4">
        <div>
            <h2 class="text-3xl font-black italic tracking-tighter uppercase">Supplier <span class="text-gold">Network</span></h2>
            <p class="text-[9px] text-gray-500 font-mono tracking-widest uppercase italic">Approved Distributors | AirTech One Ecosystem</p>
        </div>
        <a href="index.html" class="text-gold text-xs font-bold uppercase underline">Home</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-dark-panel rounded-3xl border border-gold/10 overflow-hidden">
            <div class="p-6 border-b border-gold/10 bg-black/40 font-black text-xs uppercase italic tracking-widest">Global Partners</div>
            <div class="p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-white/5 pb-3 italic">
                    <span class="text-white font-bold uppercase">Hikvision KSA</span>
                    <span class="text-[8px] bg-gold/10 text-gold px-2 py-1 rounded font-black italic">Active Portfolio</span>
                </div>
                <div class="flex justify-between items-center italic">
                    <span class="text-white font-bold uppercase">Dahua Technology</span>
                    <span class="text-[8px] bg-gold/10 text-gold px-2 py-1 rounded font-black italic">Active Portfolio</span>
                </div>
            </div>
        </div>

        <div class="bg-dark-panel rounded-3xl border border-gold/10 p-6 flex flex-col justify-center text-center">
            <p class="text-[10px] text-gray-500 uppercase font-black tracking-widest mb-2 italic">Awaiting Payouts</p>
            <h4 class="text-3xl font-bold text-white tracking-tighter italic font-mono italic">SAR 42,150.00</h4>
            <button class="mt-6 bg-gold text-black text-[10px] font-black py-2 rounded-full uppercase italic">Pay All Vendors</button>
        </div>
    </div>
</body>
</html>
