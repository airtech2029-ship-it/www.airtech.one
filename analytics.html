<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | Business Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-dark-panel { background-color: #0A0A0A; }
        .text-gold { color: #D4AF37; }
        .bg-gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F1D592 100%); }
    </style>
</head>
<body class="bg-black text-white p-6 md:p-10 italic">
    <div class="mb-10 flex justify-between items-center bg-dark-panel p-8 rounded-3xl border border-gold/10">
        <div>
            <h2 class="text-3xl font-black italic tracking-tighter uppercase">Data <span class="text-gold">Intelligence</span></h2>
            <p class="text-[9px] text-gray-500 font-mono tracking-widest uppercase italic">Market Share: Hafar Al Batin Region</p>
        </div>
        <a href="index.html" class="text-gold text-xs font-bold uppercase underline">Home</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-dark-panel p-8 rounded-3xl border border-gold/10">
            <h3 class="text-white font-bold text-xs uppercase mb-6 tracking-widest italic">Brand Market Dominance</h3>
            <div class="space-y-4">
                <div>
                    <div class="flex justify-between text-[10px] mb-1 font-black uppercase"><span>Hikvision</span><span class="text-gold">55%</span></div>
                    <div class="w-full bg-black h-1 rounded-full"><div class="bg-gold-gradient h-full w-[55%]"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] mb-1 font-black uppercase"><span>Dahua</span><span class="text-gray-500">30%</span></div>
                    <div class="w-full bg-black h-1 rounded-full"><div class="bg-white/40 h-full w-[30%]"></div></div>
                </div>
            </div>
        </div>
        <div class="bg-dark-panel p-8 rounded-3xl border border-gold/10 flex flex-col justify-center text-center">
            <p class="text-[10px] text-gray-500 uppercase font-black mb-2 italic">Avg Monthly Revenue</p>
            <h4 class="text-4xl font-black text-white italic tracking-tighter">SAR 145,000.00</h4>
            <span class="text-[9px] text-green-500 font-bold mt-2 uppercase italic">+12.5% vs Last Quarter</span>
        </div>
    </div>
</body>
</html>
