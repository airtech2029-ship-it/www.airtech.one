<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | Financial Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F1D592 100%); }
        .bg-dark-panel { background-color: #0A0A0A; }
        .text-gold { color: #D4AF37; }
    </style>
</head>
<body class="bg-black text-white p-6 md:p-10 italic">
    <div class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center bg-dark-panel p-8 rounded-3xl border border-gold/10 gap-4">
        <div>
            <h2 class="text-3xl font-black italic tracking-tighter uppercase">Financial <span class="text-gold">Ledger</span></h2>
            <p class="text-[9px] text-gray-500 font-mono tracking-widest uppercase">VAT Registered: 15% | AirTech One KSA</p>
        </div>
        <div class="flex gap-4">
            <a href="index.html" class="text-gold text-xs font-bold uppercase underline">Home</a>
            <button class="bg-gold text-black text-[10px] font-black px-4 py-2 rounded-full uppercase tracking-widest">Download Report</button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
        <div class="bg-dark-panel p-6 rounded-3xl border border-gold/10">
            <p class="text-[10px] text-gray-500 uppercase font-black mb-2">Total VAT Collected</p>
            <h4 class="text-3xl font-bold text-gold italic">SAR 18,822.00</h4>
        </div>
        <div class="bg-dark-panel p-6 rounded-3xl border border-gold/10">
            <p class="text-[10px] text-gray-500 uppercase font-black mb-2">Net Revenue</p>
            <h4 class="text-3xl font-bold text-white italic">SAR 125,480.00</h4>
        </div>
    </div>

    <div class="bg-dark-panel rounded-3xl border border-gold/10 overflow-hidden shadow-2xl">
        <table class="w-full text-left">
            <thead class="bg-black/40">
                <tr class="text-gray-500 text-[10px] uppercase font-mono border-b border-gold/5">
                    <th class="p-5">Ref No.</th>
                    <th class="p-5">Description</th>
                    <th class="p-5 text-right font-black">Amount</th>
                </tr>
            </thead>
            <tbody class="text-xs">
                <tr class="border-b border-gold/5 hover:bg-white/[0.02]">
                    <td class="p-5 text-gold font-mono font-bold">TXN-9981</td>
                    <td class="p-5 font-bold italic">Hikvision NVR Sale (Mada Payment)</td>
                    <td class="p-5 text-right font-black text-white">+2,450.00 SAR</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
