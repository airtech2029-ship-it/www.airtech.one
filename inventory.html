<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | Inventory Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F1D592 100%); }
        .bg-dark-panel { background-color: #0A0A0A; }
        .text-gold { color: #D4AF37; }
    </style>
</head>
<body class="bg-black text-white p-6 md:p-10">
    <div class="mb-10 flex justify-between items-center bg-dark-panel p-8 rounded-3xl border border-gold/10">
        <div>
            <h2 class="text-2xl font-black italic tracking-tighter uppercase">Warehouse <span class="text-gold">Inventory</span></h2>
            <p class="text-[9px] text-gray-500 font-mono tracking-widest italic uppercase">AirTech One Logistic Hub | Hafar Al Batin</p>
        </div>
        <a href="index.html" class="text-gold text-xs font-bold uppercase underline italic">Back to Home</a>
    </div>

    <div class="bg-dark-panel rounded-3xl border border-gold/10 overflow-hidden shadow-2xl">
        <table class="w-full text-left italic">
            <thead class="bg-black/40">
                <tr class="text-gray-500 text-[10px] uppercase font-mono border-b border-gold/5">
                    <th class="p-5 italic">Model No.</th>
                    <th class="p-5 italic">Description</th>
                    <th class="p-5 text-center italic">Stock Level</th>
                    <th class="p-5 text-right italic">Status</th>
                </tr>
            </thead>
            <tbody class="text-xs">
                <tr class="border-b border-gold/5 hover:bg-white/[0.02] transition-colors">
                    <td class="p-5 text-gold font-mono font-bold">DS-2CD2143G0</td>
                    <td class="p-5 font-bold italic">Hikvision 4MP IP Dome</td>
                    <td class="p-5 text-center font-black">45 Units</td>
                    <td class="p-5 text-right">
                        <span class="text-[8px] bg-green-500/10 text-green-500 px-2 py-1 rounded font-black border border-green-500/20 uppercase">Healthy</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
