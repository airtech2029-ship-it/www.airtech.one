<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One - Security & CCTV Solutions</title>
    <meta name="description" content="AirTech One - Premium CCTV Cameras, Security Systems & Networking in Saudi Arabia">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            background: #0a0e17;
            line-height: 1.6;
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
                        url('https://thumbs.dreamstime.com/b/futuristic-cyberpunk-city-flying-vehicles-neon-signs-holographic-displays-cityscape-future-dusk-towering-skyscrapers-428300334.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        .content {
            max-width: 900px;
        }

        h1 {
            font-size: 4.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(13, 71, 161, 0.8);
            color: #ffffff;
        }

        h1 span {
            color: #00d4ff;
        }

        p.subtitle {
            font-size: 1.6rem;
            margin-bottom: 2.5rem;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }

        .btn:hover {
            background: #128C7E;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.6);
        }

        .contact-info {
            margin-top: 3rem;
            font-size: 1.3rem;
        }

        .contact-info a {
            color: #00d4ff;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            h1 { font-size: 3.2rem; }
            p.subtitle { font-size: 1.3rem; }
            .btn { padding: 14px 35px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="content">
            <h1>Air<span>Tech</span> One</h1>
            <p class="subtitle">Your Trusted Partner for Advanced CCTV, Security Cameras & Networking Solutions in Saudi Arabia</p>
            
            <a href="https://wa.me/966550898978?text=Hello%20AirTech%20One%20Team%2C%20I%20would%20like%20to%20inquire%20about%20your%20products%20and%20services" class="btn">
                Contact Us on WhatsApp
            </a>

            <div class="contact-info">
                <p>WhatsApp / Call: <a href="tel:+966550898978">+966 550 898 978</a></p>
                <p>Email: <a href="mailto:admin@airtech.one">admin@airtech.one</a></p>
                <p>Location: Eastern Province, Saudi Arabia</p>
            </div>
        </div>
    </section>

</body>
</html>
