<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | VIP Security Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #1a1a1a; 
            --bg-bottom: #0a0a0a;
            --card-bg: #141414;
            --gold: #d4af37;
            --text: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Nav with Slider Button and Centered Logo */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(20, 20, 20, 0.98);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #2a2a2a;
        }

        .slider-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
            width: 30px;
            z-index: 1001;
        }

        .slider-btn span {
            display: block;
            width: 100%;
            height: 3px;
            background-color: var(--gold);
            border-radius: 2px;
        }

        .logo { 
            font-size: 1.5rem; 
            font-weight: 800; 
            color: var(--gold); 
            letter-spacing: 2px;
            text-align: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .logo span { color: #ffffff; }

        .lang-btn {
            background: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Slider Section with your Photos */
        .slider-container {
            width: 100%;
            height: 250px; 
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--gold);
        }

        .slides {
            display: flex;
            width: 300%; 
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.45, 0, 0.55, 1);
        }

        .slide {
            width: 100%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Banner images pointing to your files */
        .slide-1 { background-image: url('b1.jpg'); }
        .slide-2 { background-image: url('b2.jpg'); }
        .slide-3 { background-image: url('b3.jpg'); }

        .slide h2, .slide p { position: relative; z-index: 2; }
        .slide h2 { color: var(--gold); font-size: 1.6rem; margin: 0; font-weight: 800; }
        .slide p { font-size: 1rem; color: #fff; margin-top: 5px; }

        .brand-section { padding: 0 15px; max-width: 1100px; margin: 0 auto; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        /* Brand Cards - Touch/Hover effect removed */
        .brand-card {
            background: var(--card-bg);
            border: 1.2px solid var(--gold);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .brand-card img {
            width: 90px; 
            height: 40px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .brand-card h3 { 
            color: #ffffff; 
            font-size: 0.95rem; 
            margin: 0; 
            font-weight: 700;
            text-transform: uppercase;
        }

        footer {
            margin-top: 80px; 
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid #2a2a2a;
            background: #0a0a0a;
        }

        .contact-link {
            color: #bbb;
            text-decoration: none;
            font-size: 0.9rem;
            display: block;
            margin: 12px 0;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
            .slider-container { height: 400px; }
            .slide h2 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<nav>
    <button class="slider-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="logo">AIRTECH <span>ONE</span></div>
    <button class="lang-btn" onclick="toggleLang()">العربية</button>
</nav>

<div class="slider-container">
    <div class="slides" id="slider">
        <div class="slide slide-1">
            <h2>HIKVISION 4K</h2>
            <p>Next-Gen Surveillance Solutions</p>
        </div>
        <div class="slide slide-2">
            <h2>GIGABIT NETWORKS</h2>
            <p>Reliable Cisco & Ubiquiti Systems</p>
        </div>
        <div class="slide slide-3">
            <h2>VIP STORAGE</h2>
            <p>Western Digital & Seagate Solutions</p>
        </div>
    </div>
</div>

<div class="brand-section">
    <div class="grid">
        <div class="brand-card">
            <img src="hikvision.png" alt="Hikvision">
            <h3>HIKVISION</h3>
        </div>
        <div class="brand-card">
            <img src="ezviz.png" alt="Ezviz">
            <h3>EZVIZ</h3>
        </div>
        <div class="brand-card">
            <img src="dahua.png" alt="Dahua">
            <h3>DAHUA</h3>
        </div>
        <div class="brand-card">
            <img src="imou.png" alt="Imou">
            <h3>IMOU</h3>
        </div>
        <div class="brand-card">
            <img src="tapo.png" alt="Tapo">
            <h3>TAPO</h3>
        </div>
        <div class="brand-card">
            <img src="tplink.png" alt="TP-Link">
            <h3>TP-LINK</h3>
        </div>
        <div class="brand-card">
            <img src="wd.png" alt="Storage">
            <h3>HDD STORE</h3>
        </div>
        <div class="brand-card">
            <img src="cisco.png" alt="Cisco">
            <h3>CISCO</h3>
        </div>
        <div class="brand-card">
            <img src="ubiquiti.png" alt="Ubiquiti">
            <h3>UBIQUITI</h3>
        </div>
        <div class="brand-card">
            <img src="ruijie.png" alt="Ruijie">
            <h3>RUIJIE</h3>
        </div>
    </div>
</div>

<footer>
    <a href="mailto:admin@airtech.one" class="contact-link">📧 admin@airtech.one</a>
    <a href="https://wa.me/966550898978" class="contact-link">💬 WhatsApp Support</a>
</footer>

<script>
    let currentSlide = 0;
    const slider = document.getElementById('slider');
    
    function moveSlide() {
        currentSlide = (currentSlide + 1) % 3;
        slider.style.transform = `translateX(-${currentSlide * 33.33}%)`;
    }
    
    setInterval(moveSlide, 4000);

    function toggleLang() {
        const isAr = document.documentElement.dir === "ltr";
        document.documentElement.dir = isAr ? "rtl" : "ltr";
        document.querySelector('.lang-btn').innerText = isAr ? "English" : "العربية";
    }
</script>

</body>
</html>
