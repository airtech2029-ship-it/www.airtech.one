<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | Executive Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #F1D592 100%); }
        .bg-dark-panel { background-color: #0A0A0A; }
        .text-gold { color: #D4AF37; }
        .border-gold { border-color: #D4AF37; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body class="bg-black text-white font-sans selection:bg-gold selection:text-black">

    <nav class="border-b border-gold/10 p-6 flex justify-between items-center bg-dark-panel sticky top-0 z-50">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase">AirTech <span class="text-gold">One</span></h1>
            <p class="text-[8px] text-gray-500 font-mono tracking-[0.4em] uppercase">Enterprise OS v3.0</p>
        </div>
        <div class="flex gap-4 items-center">
            <span class="text-[10px] text-gray-400 font-bold italic tracking-widest uppercase">Hafar Al Batin HQ</span>
            <div class="w-8 h-8 rounded-full bg-gold-gradient flex items-center justify-center text-black font-black text-xs">A</div>
        </div>
    </nav>

    <div class="p-6 md:p-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-dark-panel p-8 rounded-3xl border border-gold/10 shadow-xl relative overflow-hidden group hover:border-gold/40 transition-all">
                <p class="text-[10px] text-gray-500 uppercase font-black tracking-widest mb-2 italic">Total Revenue</p>
                <h2 class="text-4xl font-bold text-white tracking-tighter italic">SAR 1.2M</h2>
                <div class="mt-4 flex items-center gap-2">
                    <span class="text-[9px] text-green-500 font-bold">+15% Growth</span>
                </div>
                <i class="fa-solid fa-chart-line absolute -right-4 -bottom-4 text-6xl text-gold/5 italic"></i>
            </div>

            <div class="bg-dark-panel p-8 rounded-3xl border border-gold/10 shadow-xl relative overflow-hidden group hover:border-gold/40 transition-all">
                <p class="text-[10px] text-gray-500 uppercase font-black tracking-widest mb-2 italic">Active Projects</p>
                <h2 class="text-4xl font-bold text-gold tracking-tighter italic">24 Sites</h2>
                <div class="mt-4 flex items-center gap-2">
                    <span class="text-[9px] text-gray-400 font-bold italic tracking-widest uppercase italic">Hikvision & Dahua Deployments</span>
                </div>
            </div>

            <div class="bg-dark-panel p-8 rounded-3xl border border-gold/10 shadow-xl relative overflow-hidden group hover:border-gold/40 transition-all">
                <p class="text-[10px] text-gray-500 uppercase font-black tracking-widest mb-2 italic">System Health</p>
                <h2 class="text-4xl font-bold text-white tracking-tighter italic uppercase italic">Optimal</h2>
                <div class="mt-4 flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-[9px] text-gray-400 font-bold italic tracking-widest uppercase">Security Shield Active</span>
                </div>
            </div>
        </div>

        <div class="flex flex-wrap gap-4">
            <a href="inventory.html" class="px-6 py-3 border border-gold/20 rounded-xl text-gold text-[10px] font-black uppercase tracking-widest hover:bg-gold hover:text-black transition-all italic">View Inventory</a>
            <a href="finance.html" class="px-6 py-3 border border-gold/20 rounded-xl text-gold text-[10px] font-black uppercase tracking-widest hover:bg-gold hover:text-black transition-all italic">Tax Reports</a>
            <a href="security.html" class="px-6 py-3 border border-gold/20 rounded-xl text-gold text-[10px] font-black uppercase tracking-widest hover:bg-gold hover:text-black transition-all italic">Security Logs</a>
        </div>
    </div>

</body>
</html>
