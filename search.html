<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirTech One — Search</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--dark:#0e0e0e;--accent:#e63329;--border:#e8e5e0;--muted:#888;--card:#fff;--text:#0e0e0e}
[data-theme="dark"]{--bg:#0e0e0e;--dark:#fff;--border:#222;--muted:#555;--card:#151515;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s}
nav{background:rgba(245,243,239,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
[data-theme="dark"] nav{background:rgba(14,14,14,.96)}
.nav-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--text);text-decoration:none;white-space:nowrap}
.nav-logo span{color:var(--accent)}
.nav-search{display:flex;gap:8px;flex:1}
.nav-search input{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:9px;padding:9px 14px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:border-color .2s}
.nav-search input:focus{border-color:var(--dark)}
.nav-search button{background:var(--dark);color:var(--bg);border:none;border-radius:9px;padding:9px 18px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.nav-actions{display:flex;align-items:center;gap:8px}
.dark-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:14px;cursor:pointer}
.cart-ico{font-size:11px;font-weight:700;color:var(--text);text-decoration:none;border:1.5px solid var(--border);border-radius:100px;padding:5px 12px;white-space:nowrap}
.content{max-width:1100px;margin:0 auto;padding:24px 20px;display:grid;grid-template-columns:220px 1fr;gap:20px}
/* FILTERS */
.filters{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;position:sticky;top:70px;align-self:start}
.filter-title{font-size:13px;font-weight:800;margin-bottom:14px}
.filter-group{margin-bottom:18px}
.filter-group-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.filter-opt{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px}
.filter-opt input{accent-color:var(--accent);width:15px;height:15px}
.price-range{width:100%;accent-color:var(--accent);margin:8px 0}
.price-vals{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
.clear-btn{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:9px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;color:var(--text);margin-top:8px}
/* RESULTS */
.results-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.results-count{font-size:13px;font-weight:700}
.results-count span{color:var(--accent)}
.sort-select{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;cursor:pointer}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.prod-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:all .2s;cursor:pointer;text-decoration:none;display:block;color:var(--text)}
.prod-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.prod-img{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:56px;position:relative}
.prod-badge{position:absolute;top:10px;left:10px;font-size:9px;font-weight:800;padding:3px 9px;border-radius:100px}
.b-sale{background:var(--accent);color:#fff}
.b-new{background:#16a34a;color:#fff}
.prod-body{padding:14px}
.prod-brand{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.prod-name{font-size:13px;font-weight:700;margin-bottom:6px;line-height:1.3}
.prod-rating{color:#f59e0b;font-size:11px;margin-bottom:8px}
.prod-price-row{display:flex;align-items:baseline;gap:8px}
.prod-price{font-size:16px;font-weight:800;color:var(--accent)}
.prod-was{font-size:11px;color:var(--muted);text-decoration:line-through}
.prod-cart{width:100%;background:var(--dark);color:var(--bg);border:none;border-radius:8px;padding:9px;font-size:12px;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:10px;transition:background .2s}
.prod-cart:hover{background:var(--accent)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tag{font-size:11px;font-weight:700;padding:5px 14px;border-radius:100px;border:1.5px solid var(--border);cursor:pointer;background:var(--card);color:var(--text);transition:all .2s}
.tag:hover,.tag.active{background:var(--dark);color:var(--bg);border-color:var(--dark)}
.wa-btn{position:fixed;bottom:24px;right:24px;width:54px;height:54px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,.4);z-index:999}
.toast{position:fixed;bottom:90px;right:24px;background:var(--dark);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transform:translateY(20px);transition:all .3s;z-index:9999}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:768px){.content{grid-template-columns:1fr}.filters{display:none}.products-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav>
  <a href="airtech-homepage.html" class="nav-logo">Air<span>Tech</span> One</a>
  <div class="nav-search">
    <input type="text" id="search-inp" placeholder="Search products, brands..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="nav-actions">
    <button class="dark-btn" onclick="toggleDark()" id="dark-btn">🌙</button>
    <a href="cart.html" class="cart-ico" id="cart-nav">🛒 (0)</a>
  </div>
</nav>

<div class="content">
  <!-- FILTERS -->
  <div class="filters">
    <div class="filter-title">🔧 Filters</div>
    <div class="filter-group">
      <div class="filter-group-title">Category</div>
      <label class="filter-opt"><input type="checkbox" checked> Smartphones</label>
      <label class="filter-opt"><input type="checkbox"> Laptops</label>
      <label class="filter-opt"><input type="checkbox"> Audio</label>
      <label class="filter-opt"><input type="checkbox"> Gaming</label>
      <label class="filter-opt"><input type="checkbox"> Wearables</label>
      <label class="filter-opt"><input type="checkbox"> Security</label>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Brand</div>
      <label class="filter-opt"><input type="checkbox" checked> Apple</label>
      <label class="filter-opt"><input type="checkbox"> Samsung</label>
      <label class="filter-opt"><input type="checkbox"> Sony</label>
      <label class="filter-opt"><input type="checkbox"> Hikvision</label>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Price Range</div>
      <input type="range" class="price-range" min="0" max="20000" value="15000" id="price-range" oninput="document.getElementById('price-max').textContent='SAR '+parseInt(this.value).toLocaleString()">
      <div class="price-vals"><span>SAR 0</span><span id="price-max">SAR 15,000</span></div>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Rating</div>
      <label class="filter-opt"><input type="radio" name="rating"> ★★★★★ 5 stars</label>
      <label class="filter-opt"><input type="radio" name="rating" checked> ★★★★☆ 4+</label>
      <label class="filter-opt"><input type="radio" name="rating"> ★★★☆☆ 3+</label>
    </div>
    <button class="clear-btn">Clear All</button>
  </div>

  <!-- RESULTS -->
  <div>
    <div class="tags">
      <span class="tag active" onclick="filterTag(this,'all')">All</span>
      <span class="tag" onclick="filterTag(this,'smartphones')">📱 Smartphones</span>
      <span class="tag" onclick="filterTag(this,'laptops')">💻 Laptops</span>
      <span class="tag" onclick="filterTag(this,'audio')">🎧 Audio</span>
      <span class="tag" onclick="filterTag(this,'gaming')">🎮 Gaming</span>
      <span class="tag" onclick="filterTag(this,'wearables')">⌚ Wearables</span>
    </div>
    <div class="results-header">
      <div class="results-count">Showing <span id="count">12</span> results</div>
      <select class="sort-select"><option>Best Match</option><option>Price: Low to High</option><option>Price: High to Low</option><option>Newest</option><option>Best Rating</option></select>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </div>
</div>

<a href="https://wa.me/966550898978" class="wa-btn" target="_blank">💬</a>
<div class="toast" id="toast"></div>

<script>
const products=[
  {name:'iPhone 16 Pro Max',brand:'Apple',price:4999,was:5899,emoji:'📱',rating:'4.9',badge:'sale',cat:'smartphones'},
  {name:'Samsung Galaxy S25 Ultra',brand:'Samsung',price:3799,was:4499,emoji:'📱',rating:'4.8',badge:'new',cat:'smartphones'},
  {name:'MacBook Pro M4 Max',brand:'Apple',price:12999,was:0,emoji:'💻',rating:'4.9',badge:'new',cat:'laptops'},
  {name:'Sony WH-1000XM5',brand:'Sony',price:1199,was:1599,emoji:'🎧',rating:'4.8',badge:'sale',cat:'audio'},
  {name:'Apple Watch Ultra 2',brand:'Apple',price:3999,was:4499,emoji:'⌚',rating:'4.7',badge:'new',cat:'wearables'},
  {name:'Hikvision 4K 8CH Kit',brand:'Hikvision',price:1899,was:2299,emoji:'📷',rating:'4.6',badge:'sale',cat:'security'},
  {name:'Dell XPS 15 OLED',brand:'Dell',price:5499,was:0,emoji:'💻',rating:'4.7',badge:'new',cat:'laptops'},
  {name:'AirPods Pro 2',brand:'Apple',price:899,was:1099,emoji:'🎧',rating:'4.8',badge:'sale',cat:'audio'},
  {name:'Samsung Galaxy Z Fold 6',brand:'Samsung',price:6499,was:7499,emoji:'📱',rating:'4.6',badge:'sale',cat:'smartphones'},
  {name:'Xiaomi 14 Ultra',brand:'Xiaomi',price:2499,was:2999,emoji:'📱',rating:'4.5',badge:'new',cat:'smartphones'},
  {name:'PlayStation 5 Slim',brand:'Sony',price:2199,was:2499,emoji:'🎮',rating:'4.9',badge:'sale',cat:'gaming'},
  {name:'TP-Link WiFi 7 AXE5400',brand:'TP-Link',price:699,was:899,emoji:'🌐',rating:'4.6',badge:'new',cat:'networking'},
];

function renderProducts(list){
  const g=document.getElementById('products-grid');
  g.innerHTML='';
  document.getElementById('count').textContent=list.length;
  list.forEach(p=>{
    g.innerHTML+=`<a href="product.html" class="prod-card">
      <div class="prod-img">${p.emoji}<span class="prod-badge b-${p.badge}">${p.badge==='sale'?'🔥 Sale':'✨ New'}</span></div>
      <div class="prod-body">
        <div class="prod-brand">${p.brand}</div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-rating">★ ${p.rating}</div>
        <div class="prod-price-row"><div class="prod-price">SAR ${p.price.toLocaleString()}</div>${p.was?'<div class="prod-was">SAR '+p.was.toLocaleString()+'</div>':''}</div>
        <button class="prod-cart" onclick="event.preventDefault();addCart('${p.name}',${p.price},'${p.emoji}')">🛒 Add to Cart</button>
      </div>
    </a>`;
  });
}

function doSearch(){
  const q=document.getElementById('search-inp').value.toLowerCase();
  const filtered=q?products.filter(p=>p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)):products;
  renderProducts(filtered);
}

function filterTag(el,cat){
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderProducts(cat==='all'?products:products.filter(p=>p.cat===cat));
}

function addCart(name,price,emoji){
  let cart=JSON.parse(localStorage.getItem('airtech_cart')||'[]');
  const ex=cart.find(i=>i.name===name);
  if(ex){ ex.qty++; } else { cart.push({name,price,emoji,qty:1}); }
  localStorage.setItem('airtech_cart',JSON.stringify(cart));
  const c=cart.reduce((a,i)=>a+i.qty,0);
  document.getElementById('cart-nav').textContent='🛒 ('+c+')';
  showToast('✅ '+name+' added!');
}

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function toggleDark(){ const h=document.getElementById('html-root'); const d=h.getAttribute('data-theme')==='dark'; h.setAttribute('data-theme',d?'':'dark'); document.getElementById('dark-btn').textContent=d?'🌙':'☀️'; localStorage.setItem('theme',d?'':'dark'); }
const saved=localStorage.getItem('theme'); if(saved==='dark'){ document.getElementById('html-root').setAttribute('data-theme','dark'); document.getElementById('dark-btn').textContent='☀️'; }
function updateCartNav(){ const c=JSON.parse(localStorage.getItem('airtech_cart')||'[]'); document.getElementById('cart-nav').textContent='🛒 ('+c.reduce((a,i)=>a+i.qty,0)+')'; }
updateCartNav();
const params=new URLSearchParams(window.location.search);
const q=params.get('q');
if(q){ document.getElementById('search-inp').value=q; doSearch(); } else { renderProducts(products); }
</script>
</body>
</html>
