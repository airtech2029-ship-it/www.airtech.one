<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirTech One | Customer Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-dark-panel { background-color: #0A0A0A; }
        .text-gold { color: #D4AF37; }
    </style>
</head>
<body class="bg-black text-white p-6 md:p-10 italic">
    <div class="mb-10 flex justify-between items-center bg-dark-panel p-8 rounded-3xl border border-gold/10">
        <div>
            <h2 class="text-3xl font-black italic tracking-tighter uppercase">Client <span class="text-gold">Intelligence</span></h2>
            <p class="text-[9px] text-gray-500 font-mono tracking-widest uppercase italic">Total Active Buyers: 1,420 | Region: Hafar</p>
        </div>
        <a href="index.html" class="text-gold text-xs font-bold uppercase underline">Home</a>
    </div>

    <div class="bg-dark-panel rounded-3xl border border-gold/10 overflow-hidden shadow-2xl">
        <table class="w-full text-left italic">
            <thead class="bg-black/40">
                <tr class="text-gray-500 text-[10px] uppercase font-mono border-b border-gold/5 italic">
                    <th class="p-5 italic">Client Name</th>
                    <th class="p-5 italic">Last Purchase</th>
                    <th class="p-5 text-right italic font-black">Account Status</th>
                </tr>
            </thead>
            <tbody class="text-xs italic">
                <tr class="border-b border-gold/5 hover:bg-white/[0.02]">
                    <td class="p-5">
                        <p class="text-white font-black italic uppercase italic">Ahmad Al-Harbi</p>
                        <span class="text-[8px] text-gray-500 font-mono italic">ID: #CUST-4491</span>
                    </td>
                    <td class="p-5 font-bold uppercase italic italic tracking-tighter">Hikvision IP Project</td>
                    <td class="p-5 text-right italic">
                        <span class="text-gold font-black uppercase tracking-widest italic italic">VIP Tier</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
